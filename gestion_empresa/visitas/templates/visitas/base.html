<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'lista_visitas' %}">🏢 GuardiaApp</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="nav-item nav-link text-warning me-3">Hola, {{ user.username }}</span>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
                    </form>
                {% else %}
                    <a class="nav-item nav-link" href="{% url 'login' %}">Iniciar Sesión</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}
{% endif %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div id="chat-flotante" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;">
    
        <button onclick="toggleChat()" style="background: #4F46E5; color: white; border: none; padding: 15px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; font-size: 24px;">
            💬
        </button>
    
        <div id="ventana-chat" style="display: none; position: absolute; bottom: 70px; right: 0; width: 300px; background: white; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); overflow: hidden; font-family: sans-serif;">
            
            <div style="background: #4F46E5; color: white; padding: 15px; font-weight: bold;">
                Chat de Equipo
            </div>
    
            <div id="chat-mensajes" style="height: 250px; overflow-y: auto; padding: 10px; background: #f3f4f6; display: flex; flex-direction: column-reverse;">
                <p style="text-align: center; color: #888;">Cargando...</p>
            </div>
    
            <form onsubmit="enviarMensaje(event)" style="display: flex; border-top: 1px solid #ddd;">
                <input type="text" id="chat-input" placeholder="Escribe un mensaje..." required style="flex-grow: 1; border: none; padding: 10px; outline: none;">
                <button type="submit" style="background: #10B981; color: white; border: none; padding: 0 15px; cursor: pointer; font-weight: bold;">➤</button>
            </form>
        </div>
    </div>
    
    <script>
        // URL relativa (detecta automáticamente tu dominio)
        const CHAT_API = '/api/chat/';
    
        function toggleChat() {
            const ventana = document.getElementById('ventana-chat');
            ventana.style.display = ventana.style.display === 'none' ? 'block' : 'none';
            if(ventana.style.display === 'block') cargarMensajes();
        }
    
        async function cargarMensajes() {
            try {
                const response = await fetch(CHAT_API);
                const data = await response.json();
                // Soporte para paginación o lista directa
                const mensajes = data.results ? data.results : data;
                
                const contenedor = document.getElementById('chat-mensajes');
                contenedor.innerHTML = ''; // Limpiar
    
                mensajes.forEach(msg => {
                    // Formatear hora
                    const hora = new Date(msg.fecha).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    // Crear burbuja
                    const div = document.createElement('div');
                    div.style.marginBottom = '8px';
                    div.style.padding = '8px 12px';
                    div.style.borderRadius = '10px';
                    div.style.background = '#e0e7ff';
                    div.style.fontSize = '14px';
                    div.innerHTML = `<strong>${msg.autor || 'Usuario'}:</strong> ${msg.texto} <span style="font-size:10px; color:#666; float:right; margin-top:2px; margin-left:5px;">${hora}</span>`;
                    
                    contenedor.prepend(div); // Poner los nuevos abajo (por el flex-reverse)
                });
            } catch (error) {
                console.error("Error cargando chat:", error);
            }
        }
    
        async function enviarMensaje(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const texto = input.value;
            if (!texto) return;
    
            // Datos a enviar
            const payload = {
                autor: "Admin", // Puedes cambiar esto dinámicamente si quieres
                texto: texto
            };
    
            try {
                await fetch(CHAT_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // Importante: Si estás en Django Template, a veces pide CSRF. 
                        // Si falla, avísame, pero con AllowAny en la vista debería pasar.
                        'X-CSRFToken': getCookie('csrftoken') 
                    },
                    body: JSON.stringify(payload)
                });
                input.value = ''; // Limpiar input
                cargarMensajes(); // Recargar chat
            } catch (error) {
                console.error("Error enviando:", error);
            }
        }
    
        // Actualizar automáticamente cada 3 segundos (Polling)
        setInterval(() => {
            const ventana = document.getElementById('ventana-chat');
            if(ventana.style.display === 'block') cargarMensajes();
        }, 3000);
    
        // Función auxiliar para obtener el token CSRF de Django
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
